name: Build Randomizer

on:
  workflow_dispatch:
  push:
    branches:
      - work/expansion-items-randomizer

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile and instrument IntelliJ GUI forms
        run: gradle --no-daemon clean jar

      - name: Package randomizer and Windows launcher
        run: |
          mkdir -p dist
          cp build/libs/PokeRandoZX.jar dist/
          cp launcher/launcher_WINDOWS.bat dist/
          cd dist
          zip -9 Universal-Pokemon-Randomizer-ZX-Windows.zip PokeRandoZX.jar launcher_WINDOWS.bat

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Pokemon-Randomizer-ZX-Windows
          path: dist/Universal-Pokemon-Randomizer-ZX-Windows.zip
          if-no-files-found: error
